# TEMPORARY: verifies the upload-artifact v7 -> download-artifact v8 round trip
# used by release.yml without publishing anything. Delete before merging.
name: Artifact round-trip verify (temporary)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      checksums: ${{ steps.sum.outputs.checksums }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up the latest version of uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Build
      run: uv build

    - name: Record checksums
      id: sum
      run: |
        (cd dist && sha256sum * | tee ../checksums.txt)
        echo "checksums=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"

    - name: Upload dists
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-dists
        path: dist/

  download:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-dists
        path: dist/

    - name: Verify layout and checksums match the build job
      env:
        CHECKSUMS: ${{ needs.build.outputs.checksums }}
      run: |
        ls -la dist/
        echo "$CHECKSUMS" | base64 -d > expected.txt
        (cd dist && sha256sum -c ../expected.txt)
        test "$(ls dist | wc -l)" -eq "$(wc -l < expected.txt)"
        ls dist/*.whl dist/*.tar.gz
