[project]
name = "rebake"
description = "A spiritual successor to cruft for managing cookiecutter projects"
readme = "README.md"
authors = [
    { name = "Ryo Kitagawa", email = "kitadrum50@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dynamic = ["version"]
dependencies = [
    "cookiecutter>=2.6.0",
    "typer>=0.15.1",
    "gitpython>=3.1.44",
    "rich>=13.9.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
rebake = "rebake.cli:app"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
markers = ["e2e: end-to-end tests using real git and cookiecutter"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
enable = true

[tool.hatch.build.targets.wheel]
packages = ["src/rebake"]

[build-system]
# hatchling 1.27 is the first release supporting PEP 639 (SPDX `license` string).
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
# src/ is small and fully annotated, so it is checked strictly. `strict = ["src"]` is not
# used because it would take precedence over every rule override below.
typeCheckingMode = "strict"
# cookiecutter ships neither stubs nor py.typed, and no types-cookiecutter exists.
# pyright still infers its types from source, so only the "stub missing" report is noise.
reportMissingTypeStubs = false
executionEnvironments = [
    # tests/ lean on mocks, fixtures and private helpers whose types are mostly Unknown,
    # so the rules that demand full annotations are relaxed there.
    { root = "tests", reportUnknownArgumentType = false, reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false, reportMissingTypeArgument = false, reportUnusedFunction = false, reportPrivateUsage = false },
    { root = "src" },
]
